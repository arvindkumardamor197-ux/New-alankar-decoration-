!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Alankar Decoration - Ahmedabad</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff;color:#222}
.header{background:#111;color:#fff;padding:15px;text-align:center}
.hero{background:linear-gradient(135deg,#ff6a00,#ee0979);color:#fff;padding:40px 20px;text-align:center}
.hero h1{font-size:32px;margin-bottom:10px}
.hero p{font-size:18px}
.btn{display:inline-block;background:#fff;color:#ee0979;padding:12px 25px;border-radius:30px;text-decoration:none;font-weight:bold;margin-top:15px}
.section{padding:25px 15px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
